  /v1/files/list:
    get:
      tags:
      - File Management
      - Files
      summary: List Files
      operationId: listFiles
      parameters:
      - name: purpose
        in: query
        required: true
        description: '列出文件分类。取值及支持格式如下：


          1. __voice_clone__: 快速复刻原始文件

          2. __prompt_audio__: 音色复刻的示例音频

          3. __t2a_async__: 异步长文本语音生成合成中音频'
        schema:
          type: string
          enum:
          - voice_clone
          - prompt_audio
          - t2a_async_input
          example: t2a_async_input
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListFileResp'
  /v1/files/retrieve_content:
    get:
      tags:
      - File Management
      - Files
      summary: Retrieve File Content
      operationId: retrieveFileContent
      parameters:
      - name: file_id
        in: query
        required: true
        description: 需要下载的文件ID
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: string
                format: binary
  /v1/files/upload:
    post:
      tags:
      - Voice Cloning
      - Files
      summary: Upload File
      operationId: uploadFile
      parameters:
      - name: Content-Type
        in: header
        required: true
        description: '请求体的媒介类型 `multipart/form-data` '
        schema:
          type: string
          enum:
          - multipart/form-data
          default: multipart/form-datan
      requestBody:
        description: ''
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - purpose
              - file
              properties:
                purpose:
                  type: string
                  description: '文件使用目的。取值及支持格式如下：

                    - __prompt_audio__: 快速复刻原始文件，（支持mp3、m4a、wav格式）'
                  default: prompt_audio
                  enum:
                  - prompt_audio
                  example: prompt_audio
                file:
                  type: string
                  format: binary
                  description: "需要上传的文件。填写文件的路径地址 \n\n支持上传的文件需遵从以下规范：\n- 上传的音频文件格式需为：mp3、m4a、wav格式\n\
                    - 上传的音频文件的时长小于8s\n- 上传的音频文件大小需不超过20mb"
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadFileResp'
