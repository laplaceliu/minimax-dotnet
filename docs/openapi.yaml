      description: '任务的当前状态。可能的状态值包括：

        - `Preparing` – 准备中

        - `Queueing` – 队列中

        - `Processing` – 生成中

        - `Success` – 成功

        - `Fail` – 失败'
    QueryVideoGenerationTaskBaseResp:
      type: object
      properties:
        status_code:
          type: integer
          description: '状态码及其分别含义如下：

            - 0：请求成功

            - 1002：触发限流，请稍后再试

            - 1004：账号鉴权失败，请检查 api key是否填写正确

            - 1026：输入内容涉及敏感内容

            - 1027：生成视频涉及敏感内容


            更多内容可查看[错误码查询列表](/api-reference/errorcode)了解详情'
        status_msg:
          type: string
          description: 状态信息，成功时为 `success`.
    VideoGenerationReq:
      type: object
      required:
      - model
      - prompt
      properties:
        model:
          type: string
          description: "模型名称。可用值：\n `MiniMax-Hailuo-2.3`, `MiniMax-Hailuo-02`, `T2V-01-Director`,\
            \ `T2V-01`."
          enum:
          - MiniMax-Hailuo-2.3
          - MiniMax-Hailuo-02
          - T2V-01-Director
          - T2V-01
        prompt:
          type: string
          description: "视频的文本描述，最大 2000 字符。对于 `MiniMax-Hailuo-2.3`、`MiniMax-Hailuo-02`\
            \ 和 `*-Director` 系列模型，支持使用 `[指令]` 语法进行运镜控制。\n可在 prompt 中通过 [指令] 格式添加运镜指令，以实现精确的镜头控制。\n\
            \n- 支持 15 种运镜指令的指令:\n\t - 左右移: [左移], [右移]\n\t - 左右摇: [左摇], [右摇]\n\t -\
            \ 推拉: [推进], [拉远]\n\t - 升降: [上升], [下降]\n\t - 上下摇: [上摇], [下摇]\n\t - 变焦:\
            \ [变焦推近], [变焦拉远]\n\t - 其他: [晃动], [跟随], [固定]\n\n - 使用规则:\n\t - 组合运镜: 同一组\
            \ [] 内的多个指令会同时生效，如 [左摇,上升]，建议组合不超过 3 个\n\t - 顺序运镜: prompt 中前后出现的指令会依次生效，如\
            \ \"...[推进], 然后...[拉远]\"\n\t - 自然语言: 也支持通过自然语言描述运镜，但使用标准指令能获得更准确的响应 "
        prompt_optimizer:
          type: boolean
          description: 是否自动优化 `prompt`，默认为 `true`。设为 `false` 可进行更精确的控制
        fast_pretreatment:
          type: boolean
          description: 是否缩短 `prompt_optimizer` 的优化耗时，默认为 false。仅对 `MiniMax-Hailuo-2.3`
            和 `MiniMax-Hailuo-02` 模型生效。
        duration:
          type: integer
          description: '视频时长（秒），默认值为 6。其可用值与模型和分辨率相关：

            | Model |  720P |768P | 1080P |

            | :--- |:--- |:--- | :--- |

            | MiniMax-Hailuo-2.3 | - | `6` 或 `10` | `6` |

            | MiniMax-Hailuo-02 | - | `6` 或 `10` | `6` |

            | 其他模型 | `6` | - |`6` |  '
        resolution:
          type: string
          description: '视频分辨率。其可用值与模型相关：

            | Model | 6s | 10s |

            | :--- | :--- | :--- |

            | MiniMax-Hailuo-2.3 |  `768P` (默认), `1080P` |  `768P` (默认) |

            | MiniMax-Hailuo-02 |  `768P` (默认), `1080P` |  `768P` (默认) |

            | 其他模型 | `720P` (默认) | 不支持 |'
          enum:
          - 720P
          - 768P
          - 1080P
        callback_url:
          type: string
          description: 接收任务状态更新通知的回调 URL。支持配置回调地址，验证通过后当任务状态变更时会推送最新状态。状态包括：processing（生成中）、success（成功）、failed（失败）
        aigc_watermark:
          type: boolean
          description: 是否在生成的视频中添加水印，默认为 `false`
      example:
        model: MiniMax-Hailuo-2.3
        prompt: A man picks up a book [Pedestal up], then reads [Static shot].
        duration: 6
        resolution: 1080P
    VideoGenerationResp:
      type: object
