            ![pitch adjustment](https://filecdn.minimax.chat/public/5d210c47-4236-4e81-893b-16cc1ef0302d.png)'
          minimum: -100
          maximum: 100
        intensity:
          type: integer
          description: '强度调整（力量感/柔和），范围 [-100,100]，数值接近 -100，声音更刚劲；接近 100，声音更轻柔


            ![intensity adjustment](https://filecdn.minimax.chat/public/862d493e-71d5-4d1f-b7c3-9ac51890631b.png)'
          minimum: -100
          maximum: 100
        timbre:
          type: integer
          description: '音色调整（磁性/清脆），范围 [-100,100]，数值接近 -100，声音更浑厚；数值接近 100，声音更清脆


            ![timbre adjustment](https://filecdn.minimax.chat/public/5f0e6cae-363a-452b-8d42-fbc4ef5a0510.png)'
          minimum: -100
          maximum: 100
        sound_effects:
          type: string
          description: '音效设置，单次仅能选择一种，可选值：

            1. spacious_echo（空旷回音）

            2. auditorium_echo（礼堂广播）

            3. lofi_telephone（电话失真）

            4. robotic（电音）'
          enum:
          - spacious_echo
          - auditorium_echo
          - lofi_telephone
          - robotic
    T2AAsyncV2QueryResp:
      type: object
      properties:
        task_id:
          type: integer
          format: int64
          description: 任务 ID
        status:
          type: string
          description: '该任务的当前状态。


            - **Processing**: 该任务正在处理中

            - **Success**: 该任务已完成

            - **Failed**: 任务失败

            - **Expired**: 任务已过期'
          enum:
          - success
          - failed
          - expired
          - processing
        file_id:
          type: integer
          format: int64
          description: '任务创建成功后返回的对应音频文件的 ID。

            - 当任务完成后，可通过 file_id 调用 [文件检索接口](/api-reference/file-management-retrieve)
            进行下载

            - 当请求出错时，不返回该字段

            注意：返回的下载 URL 自生成起 9 小时（32,400 秒）内有效，过期后文件将失效，生成的信息便会丢失，请注意下载信息的时间'
        base_resp:
