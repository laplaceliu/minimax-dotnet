components:
  schemas:
    GenerateLyricsReq:
      type: object
      required:
      - mode
      properties:
        mode:
          type: string
          description: 生成模式。<br>`write_full_song`：写完整歌曲<br>`edit`：编辑/续写歌词
          enum:
          - write_full_song
          - edit
        prompt:
          type: string
          description: 提示词/指令，用于描述歌曲主题、风格或编辑方向。为空时随机生成。
          maxLength: 2000
        lyrics:
          type: string
          description: 现有歌词内容，仅在 `edit` 模式下有效。可用于续写或修改已有歌词。
          maxLength: 3500
        title:
          type: string
          description: 歌曲标题。传入后输出将保持该标题不变。
      example:
        mode: write_full_song
        prompt: 一首关于夏日海边的轻快情歌
    GenerateLyricsResp:
      type: object
      properties:
        song_title:
          type: string
          description: 生成的歌名。若请求传入 `title` 则保持一致。
        style_tags:
          type: string
          description: 风格标签，逗号分隔。例如：`Pop, Upbeat, Female Vocals`
        lyrics:
          type: string
          description: 生成的歌词，包含结构标签。可直接用于[音乐生成接口](/api-reference/music-generation)的
            `lyrics` 参数生成歌曲。<br>支持的结构标签（14种）：`[Intro]`, `[Verse]`, `[Pre-Chorus]`,
            `[Chorus]`, `[Hook]`, `[Drop]`, `[Bridge]`, `[Solo]`, `[Build-up]`, `[Instrumental]`,
            `[Breakdown]`, `[Break]`, `[Interlude]`, `[Outro]`
        base_resp:
          $ref: '#/components/schemas/BaseResp'
      example:
        song_title: 夏日海风的约定
        style_tags: Mandopop, Summer Vibe, Romance, Lighthearted, Beach Pop
        lyrics: '[Intro]

          (Ooh-ooh-ooh)

          (Yeah)

          阳光洒满了海面


          [Verse 1]

          海风轻轻吹拂你发梢

          Smiling face, like a summer dream

          浪花拍打着脚边

          Leaving footprints, you and me

          沙滩上留下我们的笑

          Every moment, a sweet melody

          看着你眼中的闪耀

          Like the stars in the deep blue sea


          [Pre-Chorus]

          你说这感觉多么奇妙

          (So wonderful)

          想要永远停留在这一秒

          (Right here, right now)

          心跳加速，像海浪在奔跑


          [Chorus]

          Oh, 夏日的海边，我们的约定

          阳光下，你的身影，如此动听

          微风吹散了烦恼，只留下甜蜜

          这瞬间，只想和你，永远在一起

          (永远在一起)


          [Verse 2]

          ...'
        base_resp:
          status_code: 0
          status_msg: success
    BaseResp:
      type: object
      description: 状态码及详情
      properties:
        status_code:
          type: integer
          description: '状态码及其分别含义如下：


            `0`: 请求成功


            `1002`: 触发限流，请稍后再试


            `1004`: 账号鉴权失败，请检查 API-Key 是否填写正确


            `1008`: 账号余额不足


            `1026`: 输入包含敏感内容


            `2013`: 传入参数异常，请检查入参是否按要求填写


            `2049`: 无效的api key


            更多内容可查看 [错误码查询列表](/api-reference/errorcode) 了解详情'
        status_msg:
          type: string
          description: 具体错误详情
    CoverPreprocessReq:
      type: object
      required:
      - model
      properties:
        model:
          type: string
          description: 模型名称。必须为 `music-cover`。
          enum:
          - music-cover
        audio_url:
          type: string
          description: '参考音频的 URL 地址。`audio_url` 和 `audio_base64` 必须且只能提供其中一个。


            参考音频要求：

            - 时长：6 秒至 6 分钟

            - 大小：最大 50 MB

            - 格式：支持常见音频格式（mp3、wav、flac 等）'
        audio_base64:
          type: string
          description: 'Base64 编码的参考音频。`audio_url` 和 `audio_base64` 必须且只能提供其中一个。


            参考音频要求：

            - 时长：6 秒至 6 分钟

            - 大小：最大 50 MB

            - 格式：支持常见音频格式（mp3、wav、flac 等）'
      example:
        model: music-cover
        audio_url: https://example.com/song.mp3
    CoverPreprocessResp:
      type: object
      properties:
        cover_feature_id:
          type: string
          description: '预处理后的音频特征唯一标识，有效期 24 小时。将此 ID 传入[音乐生成接口](/api-reference/music-generation)的
            `cover_feature_id` 参数以进行两步翻唱。


            相同音频内容会返回相同的 `cover_feature_id`（基于 MD5 去重）。'
        formatted_lyrics:
          type: string
          description: 通过 ASR 从参考音频中提取并格式化的歌词，包含 `[Verse]`、`[Chorus]`、`[Bridge]` 等段落标签。你可以修改这些歌词后传入音乐生成接口。
        structure_result:
          type: string
          description: JSON 字符串，包含歌曲结构分析结果，含段落类型（`intro`、`verse`、`chorus`、`bridge`、`outro`、`inst`、`silence`）及其起止时间戳（秒）。
        audio_duration:
          type: number
          format: double
          description: 参考音频的时长（秒）。
        trace_id:
          type: string
          description: 请求追踪 ID。
        base_resp:
          $ref: '#/components/schemas/BaseResp'
      example:
        cover_feature_id: a1b2c3d4e5f67890abcdef1234567890
        formatted_lyrics: '[Verse 1]

          歌曲第一行

          歌曲第二行


          [Chorus]

          这是副歌部分

          高声歌唱'
        structure_result: '{"num_segments":4,"segments":[{"start":0,"end":15.5,"label":"intro"},{"start":15.5,"end":45.2,"label":"verse"},{"start":45.2,"end":75.0,"label":"chorus"},{"start":75.0,"end":90.0,"label":"outro"}]}'
        audio_duration: 90
        trace_id: 061e5f144eb7f10b1fdde81126e24f91
        base_resp:
          status_code: 0
          status_msg: success
    GenerateMusicReq:
      type: object
      required:
      - model
      properties:
        model:
          type: string
          description: '使用的模型名称。可选值：


            - `music-2.6`（推荐）：文本生成音乐，仅限 Token Plan 用户和付费用户使用，RPM 较高

            - `music-cover`：基于参考音频生成翻唱版本，仅限 Token Plan 用户和付费用户使用，RPM 较高

            - `music-2.6-free`：`music-2.6` 的限免版本，所有用户可通过 API Key 使用，RPM 较低

            - `music-cover-free`：`music-cover` 的限免版本，所有用户可通过 API Key 使用，RPM 较低'
          enum:
          - music-2.6
          - music-cover
          - music-2.6-free
          - music-cover-free
        prompt:
          type: string
          description: '音乐的描述，用于指定风格、情绪和场景。例如"流行音乐, 难过, 适合在下雨的晚上"。<br>注意：

            - `music-2.6` / `music-2.6-free` 纯音乐（`is_instrumental: true`）：必填，长度限制
            [1, 2000] 个字符

            - `music-2.6` / `music-2.6-free`（非纯音乐）：可选，长度限制 [0, 2000] 个字符

            - `music-cover` / `music-cover-free`：必填，描述目标翻唱风格，长度限制 [10, 300] 个字符'
          maxLength: 2000
        lyrics:
          type: string
          description: '歌曲歌词，使用 `\n` 分隔每行。支持结构标签：`[Intro]`, `[Verse]`, `[Pre Chorus]`,
            `[Chorus]`, `[Interlude]`, `[Bridge]`, `[Outro]`, `[Post Chorus]`, `[Transition]`,
            `[Break]`, `[Hook]`, `[Build Up]`, `[Inst]`, `[Solo]`。

            <br>

            注意：

            - `music-2.6` / `music-2.6-free` 纯音乐（`is_instrumental: true`）：非必填

            - `music-2.6` / `music-2.6-free`（非纯音乐）：必填，长度限制 [1, 3500] 个字符

            - `music-cover` / `music-cover-free`：可选，如不传则通过 ASR 自动从参考音频中提取歌词，长度限制 [10,
            1000] 个字符

            - 当 `lyrics_optimizer: true` 且 `lyrics` 为空时，系统将根据 `prompt` 自动生成歌词'
          minLength: 1
          maxLength: 3500
        stream:
          type: boolean
          description: 是否使用流式传输，默认为 `false`
          default: false
        output_format:
          type: string
          description: 音频的返回格式，可选值为 `url` 或 `hex`，默认为 `hex`。当 `stream` 为 `true` 时，仅支持
            `hex` 格式。注意：url 的有效期为 24 小时，请及时下载
          enum:
          - url
          - hex
          default: hex
        audio_setting:
          $ref: '#/components/schemas/AudioSetting'
        aigc_watermark:
          type: boolean
          description: '是否在音频末尾添加水印，默认为 `false`。仅在非流式 (`stream: false`) 请求时生效'
        lyrics_optimizer:
          type: boolean
          description: '是否根据 `prompt` 描述自动生成歌词。仅 `music-2.6` / `music-2.6-free` 支持。


            设为 `true` 且 `lyrics` 为空时，系统会根据 prompt 自动生成歌词。默认为 `false`'
          default: false
        is_instrumental:
          type: boolean
          description: '是否生成纯音乐（无人声）。仅 `music-2.6` / `music-2.6-free` 支持。


            设为 `true` 时，`lyrics` 字段非必填。默认为 `false`'
          default: false
        audio_url:
          type: string
          description: '参考音频的 URL 地址。仅用于 `music-cover` / `music-cover-free` 模型。`audio_url`
            和 `audio_base64` 必须且只能提供其中一个。与 `cover_feature_id` 互斥。


            参考音频要求：

            - 时长：6 秒至 6 分钟

            - 大小：最大 50 MB

            - 格式：支持常见音频格式（mp3、wav、flac 等）'
        audio_base64:
          type: string
          description: 'Base64 编码的参考音频。仅用于 `music-cover` / `music-cover-free` 模型。`audio_url`
            和 `audio_base64` 必须且只能提供其中一个。与 `cover_feature_id` 互斥。


            参考音频要求：

            - 时长：6 秒至 6 分钟

            - 大小：最大 50 MB

            - 格式：支持常见音频格式（mp3、wav、flac 等）'
        cover_feature_id:
          type: string
          description: '[翻唱前处理](/api-reference/music-cover-preprocess) 接口返回的特征 ID，用于**两步翻唱流程**，支持修改歌词后生成翻唱。


            仅用于 `music-cover` / `music-cover-free` 模型。与 `audio_url` 和 `audio_base64`
            互斥。


            - 传入时 `lyrics` 为必填（长度限制 [10, 1000] 个字符）

            - `cover_feature_id` 有效期为 24 小时

            - 相同音频内容返回相同的 `cover_feature_id`'
      example:
        model: music-2.6
        prompt: 独立民谣,忧郁,内省,渴望,独自漫步,咖啡馆
        lyrics: '[verse]

          街灯微亮晚风轻抚

          影子拉长独自漫步

          旧外套裹着深深忧郁

          不知去向渴望何处

          [chorus]

          推开木门香气弥漫

          熟悉的角落陌生人看'
        audio_setting:
          sample_rate: 44100
          bitrate: 256000
          format: mp3
    GenerateMusicResp:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/MusicData'
        base_resp:
          $ref: '#/components/schemas/BaseResp'
      example:
        data:
          audio: hex编码的音频数据
          status: 2
        trace_id: 04ede0ab069fb1ba8be5156a24b1e081
        extra_info:
          music_duration: 25364
          music_sample_rate: 44100
          music_channel: 2
          bitrate: 256000
          music_size: 813651
        analysis_info: null
        base_resp:
          status_code: 0
          status_msg: success
    AudioSetting:
      type: object
      description: 音频输出配置
      properties:
        sample_rate:
          type: integer
          description: 采样率。可选值：`16000`, `24000`, `32000`, `44100`
        bitrate:
          type: integer
          description: 比特率。可选值：`32000`, `64000`, `128000`, `256000`
        format:
          type: string
          description: 音频编码格式。
          enum:
          - mp3
          - wav
          - pcm
    MusicData:
      type: object
      properties:
        status:
          type: integer
          description: '音乐合成状态：

            1: 合成中

            2: 已完成'
        audio:
          type: string
          description: 当 `output_format` 为 `hex` 时返回，是音频文件的 16 进制编码字符串
    CreateMessageReq:
      type: object
      required:
      - model
      - messages
      properties:
        model:
          type: string
          description: 模型 ID
          enum:
          - MiniMax-M2.7
          - MiniMax-M2.7-highspeed
          - MiniMax-M2.5
          - MiniMax-M2.1
        system:
          description: 设定模型的角色和行为
          oneOf:
          - type: string
            description: 纯文本系统提示词
          - type: array
            description: 内容块数组格式的系统提示词
            items:
              type: object
              properties:
                type:
                  type: string
                  enum:
                  - text
                  description: 内容块类型
                text:
                  type: string
                  description: 文本内容
              required:
              - type
              - text
        messages:
          type: array
          description: 包含对话历史的消息列表
          items:
            $ref: '#/components/schemas/Message'
        stream:
          type: boolean
          description: 是否使用流式传输，默认为 `false`。设置为 `true` 后，响应将分批返回
          default: false
        max_tokens:
          type: integer
          format: int64
          description: 指定生成内容长度的上限（Token 数），上限为 2048。超过上限的内容会被截断。如果生成因 `length` 原因中断，请尝试调高此值
          minimum: 1
        temperature:
          type: number
          format: double
          description: 温度系数，影响输出随机性，取值范围 (0, 1]，`MiniMax-M2.7` 模型默认值为 1.0。值越高，输出越随机；值越低，输出越确定
          minimum: 0
          exclusiveMinimum: 0
          maximum: 1
          default: 1
        top_p:
          type: number
          format: double
          description: 采样策略，影响输出随机性，取值范围 (0, 1]，`MiniMax-M2.7` 模型默认值为 0.95
          minimum: 0
          exclusiveMinimum: 0
          maximum: 1
          default: 0.95
    CreateMessageResp:
      type: object
      properties:
        id:
          type: string
          description: 本次响应的唯一 ID
        type:
          type: string
          description: 对象类型，固定为 `message`
          enum:
          - message
        role:
          type: string
          description: 角色，固定为 `assistant`
          enum:
          - assistant
        model:
          type: string
          description: 本次请求使用的模型 ID
        content:
          type: array
          description: 响应内容块列表
          items:
            $ref: '#/components/schemas/ContentBlock'
        stop_reason:
          type: string
          description: '生成停止的原因：

            - `end_turn`: 模型自然结束

            - `max_tokens`: 达到 `max_tokens` 上限

            - `stop_sequence`: 命中停止序列'
          enum:
          - end_turn
          - max_tokens
          - stop_sequence
        usage:
          $ref: '#/components/schemas/Usage'
        base_resp:
          type: object
          description: 错误状态码和详情
          properties:
            status_code:
              type: integer
              format: int64
              description: '状态码


                - `1000`: 未知错误

                - `1001`: 请求超时

                - `1002`: 触发限流

                - `1004`: 鉴权失败

                - `1008`: 余额不足

                - `1013`: 服务内部错误

                - `1027`: 输出内容错误

                - `1039`:  Token 超出限制

                - `2013`: 参数错误


                更多内容可查看 [错误码查询列表](/api-reference/errorcode) 了解详情'
            status_msg:
              type: string
              description: 错误详情
    StreamEvent:
      type: object
      description: ''
      required:
      - type
      properties:
        type:
          type: string
          description: '事件类型：

            - `message_start`: 消息开始，包含完整的消息元数据

            - `ping`: 心跳事件

            - `content_block_start`: 内容块开始

            - `content_block_delta`: 内容块增量更新

            - `content_block_stop`: 内容块结束

            - `message_delta`: 消息级别的增量更新（如 stop_reason）

            - `message_stop`: 消息结束'
          enum:
          - message_start
          - ping
          - content_block_start
          - content_block_delta
          - content_block_stop
          - message_delta
          - message_stop
        message:
          type: object
          description: 消息对象（`type` 为 `message_start` 时返回）
          properties:
            id:
              type: string
              description: 消息的唯一 ID
            type:
              type: string
              enum:
              - message
            role:
              type: string
              enum:
              - assistant
            content:
              type: array
              description: 内容块列表，初始为空数组
              items:
                $ref: '#/components/schemas/ContentBlock'
            model:
              type: string
              description: 模型 ID
            stop_reason:
              type: string
              nullable: true
              description: 停止原因，流式开始时为 null
            stop_sequence:
              type: string
              nullable: true
              description: 停止序列，流式开始时为 null
            usage:
              $ref: '#/components/schemas/Usage'
            service_tier:
              type: string
              description: 服务层级
        index:
          type: integer
          description: 内容块的索引（`content_block_start`、`content_block_delta`、`content_block_stop`
            时返回）
        content_block:
          $ref: '#/components/schemas/ContentBlock'
          description: 内容块对象（`type` 为 `content_block_start` 时返回）
        delta:
          type: object
          description: 增量更新内容（`content_block_delta` 或 `message_delta` 时返回）
          properties:
            type:
              type: string
              description: 增量类型，如 `text_delta`
            text:
              type: string
              description: 增量文本内容
            stop_reason:
              type: string
              description: 停止原因（`message_delta` 时返回）
              enum:
              - end_turn
              - max_tokens
              - stop_sequence
        usage:
          $ref: '#/components/schemas/Usage'
          description: Token 使用情况（`message_delta` 时返回）
    Message:
      type: object
      required:
      - role
      - content
      properties:
        role:
          type: string
          enum:
          - user
          - assistant
          - user_system
          - group
          - sample_message_user
          - sample_message_ai
          description: '消息发送者的角色

            - `user`: 用户的输入

            - `assistant`: 模型的历史回复

            - `user_system`: 设定用户的角色和人设

            - `group`: 对话的名称

            - `sample_message_user`: 示例的用户输入

            - `sample_message_ai`: 示例的模型输出'
        content:
          description: 消息内容，支持纯文本字符串或内容块数组
          oneOf:
          - type: string
            description: 纯文本消息
          - type: array
            description: 内容块数组，支持文本和思考等内容块
            items:
              $ref: '#/components/schemas/ContentBlock'
    ContentBlock:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          description: '内容块类型：

            - `text`: 文本内容

            - `thinking`: 模型思考过程'
          enum:
          - text
          - thinking
        text:
          type: string
          description: 文本内容（当 `type` 为 `text` 时）
        thinking:
          type: string
          description: 模型的思考过程内容（当 `type` 为 `thinking` 时）
        signature:
          type: string
          description: 思考内容的签名（当 `type` 为 `thinking` 时）
    Usage:
      type: object
      description: 本次请求的 Token 使用情况
      properties:
        input_tokens:
          type: integer
          description: 输入消耗的 Token 数
        output_tokens:
          type: integer
          description: 输出消耗的 Token 数
    ChatCompletionReq:
      type: object
      required:
      - model
      - messages
      properties:
        model:
          type: string
          description: 模型 ID
          enum:
          - MiniMax-M2.7
          - MiniMax-M2.7-highspeed
          - MiniMax-M2.5
          - MiniMax-M2.1
        stream:
          type: boolean
          description: 是否使用流式传输，默认为 `false`。设置为 `true` 后，响应将分批返回
          default: false
        max_completion_tokens:
          type: integer
          format: int64
          description: 指定生成内容长度的上限（Token 数），上限为 2048。超过上限的内容会被截断。如果生成因 `length` 原因中断，请尝试调高此值
          minimum: 1
        temperature:
          type: number
          format: double
          description: 温度系数，影响输出随机性，取值范围 (0, 1]，模型默认值为 1.0。值越高，输出越随机；值越低，输出越确定
          minimum: 0
          exclusiveMinimum: 0
          maximum: 1
          default: 1
        top_p:
          type: number
          format: double
          description: 采样策略，影响输出随机性，取值范围 (0, 1]，模型默认值为 0.95
          minimum: 0
          exclusiveMinimum: 0
          maximum: 1
          default: 0.95
        messages:
          type: array
          description: 包含对话历史的消息列表。更多 message 参数说明请参考 [文本对话使用指南](/guides/text-chat)
          items:
            $ref: '#/components/schemas/Message'
    ChatCompletionResp:
      type: object
      properties:
        id:
          type: string
          description: 本次响应的唯一 ID
        choices:
          type: array
          description: 响应选择列表
          items:
            type: object
            properties:
              finish_reason:
                type: string
                description: 生成停止的原因：`stop` (自然结束), `length` (达到 `max_completion_tokens`
                  上限)
                enum:
                - stop
                - length
              index:
                type: integer
                description: 选项的索引，从 0 开始
              message:
                type: object
                description: 模型生成的完整回复
                required:
                - content
                - role
                properties:
                  content:
                    type: string
                    description: 文本回复内容
                  role:
                    type: string
                    description: 角色，固定为 `assistant`
                    enum:
                    - assistant
        created:
          type: integer
          format: int64
          description: 响应创建的 Unix 时间戳（秒）
        model:
          type: string
          description: 本次请求使用的模型 ID
        object:
          type: string
          description: 对象类型。非流式为 `chat.completion`，流式为 `chat.completion.chunk`
          enum:
          - chat.completion
          - chat.completion.chunk
        usage:
          $ref: '#/components/schemas/Usage'
        input_sensitive:
          type: boolean
          description: 输入内容是否命中敏感词。如果输入内容严重违规，接口会返回内容违规错误信息，回复内容为空
        input_sensitive_type:
          type: integer
          format: int64
          description: 输入命中敏感词类型，当input_sensitive为true时返回。取值为以下其一：1 严重违规；2 色情；3 广告；4
            违禁；5 谩骂；6 暴恐；7 其他
        output_sensitive:
          type: boolean
          description: 输出内容是否命中敏感词。如果输出内容严重违规，接口会返回内容违规错误信息，回复内容为空
        output_sensitive_type:
          type: integer
          format: int64
          description: 输出命中敏感词类型
        base_resp:
          type: object
          description: 错误状态码和详情
          properties:
            status_code:
              type: integer
              format: int64
              description: '状态码


                - `1000`: 未知错误

                - `1001`: 请求超时

                - `1002`: 触发限流

                - `1004`: 鉴权失败

                - `1008`: 余额不足

                - `1013`: 服务内部错误

                - `1027`: 输出内容错误

                - `1039`:  Token 超出限制

                - `2013`: 参数错误


                更多内容可查看 [错误码查询列表](/api-reference/errorcode) 了解详情'
            status_msg:
              type: string
              description: 错误详情
    ChatCompletionChunk:
      type: object
      description: ''
      properties:
        id:
          type: string
          description: 本次响应的唯一 ID
        choices:
          type: array
          description: 流式响应选择列表
          items:
            type: object
            properties:
              index:
                type: integer
                description: 选项的索引，从 0 开始
              delta:
                type: object
                description: 增量内容
                properties:
                  role:
                    type: string
                    description: 角色，固定为 `assistant`
                    enum:
                    - assistant
                  content:
                    type: string
                    description: 增量文本内容
              finish_reason:
                type: string
                nullable: true
                description: 生成停止的原因，未结束时为 null：`stop`（自然结束），`length`（达到 `max_completion_tokens`
                  上限）
                enum:
                - stop
                - length
        created:
          type: integer
          format: int64
          description: 响应创建的 Unix 时间戳（秒）
        model:
          type: string
          description: 本次请求使用的模型 ID
        object:
          type: string
          description: 对象类型，固定为 `chat.completion.chunk`
          enum:
          - chat.completion.chunk
        usage:
          $ref: '#/components/schemas/Usage'
          description: Token 使用情况（仅在最后一个 chunk 中返回）
        input_sensitive_type:
          type: integer
          format: int64
          description: 输入命中敏感词类型
        output_sensitive:
          type: boolean
          description: 输出内容是否命中敏感词
        output_sensitive_type:
          type: integer
          format: int64
          description: 输出命中敏感词类型
    RetrieveFileResp:
